variables:
  GIT_SUBMODULE_STRATEGY: recursive
  DEBIAN_FRONTEND: noninteractive

cpp_unit_tests:
  image: danger89/cmake:latest
  before_script:
    - apt-get update -qy
    - apt-get install -y ninja-build gcovr python3 python3-pip
  script:
    - mkdir build && cd build
    - cmake -GNinja -DBUILD_TESTS=ON ..
    - ninja
    - ./ExampleTest
    - gcovr -r ../  -e '.*/extlibs/.*'

python_build:
  image: ubuntu:24.04
  before_script:
    - apt-get update -qy
    - apt-get install -y python3-pip
  script:
    - set -e
    - python3 -m venv pyenv && . pyenv/bin/activate
    - pip3 install --upgrade pip
    - pip install -e .
    # - coverage run -m unittest discover -v semproject/testing
    # - coverage report -m