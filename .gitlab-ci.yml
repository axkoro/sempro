variables:
  GIT_SUBMODULE_STRATEGY: recursive

stages:
  - build
  - evaluate

cpp_unit_tests:
  stage: build
  image: gitlab.informatik.hu-berlin.de:4567/axkoro/sempro:cpp
  script:
    - mkdir build && cd build
    - cmake -GNinja -DBUILD_TESTS=ON ..
    - ninja
    - ./GraphTest
    - ./KNNImputerTest
    - ./LouvainTest
    - ./LouvainImputerTest
    - ./DeepWalkTest
    - gcovr -r ../  -e '.*/extlibs/.*'

python_build:
  stage: build
  image: gitlab.informatik.hu-berlin.de:4567/axkoro/sempro:python
  script:
    - python3 -m venv pyenv && . pyenv/bin/activate
    - pip3 install --upgrade pip build
    - python -m build --wheel
  artifacts:
    paths:
      - dist/*.whl

evaluate:
  stage: evaluate
  image: gitlab.informatik.hu-berlin.de:4567/axkoro/sempro:python
  timeout: 2h
  allow_failure: true
  needs:
    - python_build
  script:
    - python3 -m venv pyenv && . pyenv/bin/activate
    - pip install dist/*.whl
    - evaluate --all