variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_STRATEGY: clone
  GIT_DEPTH: 0

stages:
  - build
  - test
  - evaluate

python_build:
  stage: build
  image: gitlab.informatik.hu-berlin.de:4567/axkoro/sempro:python
  script:
    - python -m build --wheel .
  artifacts:
    paths:
      - dist/*.whl

